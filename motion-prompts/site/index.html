<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Prompts</title>
  <meta name="description" content="Bibliothèque de prompts pour reproduire des vidéos de motion design.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <strong>Motion Prompts</strong>
      <span class="count" id="total"></span>
    </div>
    <div class="access" id="access">
      <form id="unlock" class="unlock">
        <input id="code" type="password" placeholder="Code d'accès" autocomplete="off" aria-label="Code d'accès">
        <button type="submit">Débloquer</button>
      </form>
      <span id="unlocked" class="unlocked" hidden>✓ Accès débloqué <button id="logout" class="link">quitter</button></span>
      <span id="unlock-msg" class="msg" role="status"></span>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="row">
        <span class="label">Filtre :</span>
        <div class="pills" id="type-pills"></div>
        <input id="search" type="search" placeholder="Rechercher…" aria-label="Rechercher">
        <div class="right">
          <select id="sort" aria-label="Trier">
            <option value="recent">Plus récents</option>
            <option value="az">A → Z</option>
          </select>
          <button id="pause" class="ghost" aria-pressed="false">❚❚ Mettre en pause les aperçus</button>
        </div>
      </div>
      <div class="pills cats" id="cat-pills"></div>
    </div>

    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Aucun modèle ne correspond à ce filtre.</p>
  </main>

  <dialog id="modal">
    <div class="modal-inner">
      <button class="close" id="close" aria-label="Fermer">✕</button>
      <video id="m-video" controls playsinline loop></video>
      <div class="m-body">
        <h2 id="m-title"></h2>
        <p class="m-meta" id="m-meta"></p>
        <div class="tabs" id="m-tabs"></div>
        <div class="prompt-box">
          <pre id="m-prompt"></pre>
          <div class="locked" id="m-locked">
            <p>🔒 Le prompt est réservé aux acheteurs du pack.</p>
            <p>Entre ton code d'accès en haut de la page pour le débloquer.</p>
          </div>
        </div>
        <div class="m-actions">
          <button id="copy">Copier le prompt</button>
          <span class="msg" id="copy-msg"></span>
        </div>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
